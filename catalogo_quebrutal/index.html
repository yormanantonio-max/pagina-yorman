       ========================================================================== */
    const buildWhatsAppUrl = (product, customMessage = null, useSecondary = false) => {
      const targetPhone = useSecondary
        ? BRAND_CONFIG.contacts.secondary.waNumber
        : BRAND_CONFIG.contacts.primary.waNumber;

      if (customMessage) {
        return `https://wa.me/${targetPhone}?text=${encodeURIComponent(customMessage)}`;
      }

      const priceInfo = product.priceUSD
        ? ` ($${product.priceUSD.toFixed(2)})`
        : '';
      const presentationInfo = product.dimensions
        ? ` [${product.dimensions} — ${product.yieldText}]`
        : '';

      const message = `Hola, ¡Qué Brutal! Estoy interesado en el producto *${product.name}*${priceInfo}${presentationInfo}. Me gustaría conocer su disponibilidad y condiciones de pedido.`;
      return `https://wa.me/${targetPhone}?text=${encodeURIComponent(message)}`;
    };

    const formatUSD = (price, fallbackLabel = 'Consultar') => {
      if (typeof price === 'number' && !isNaN(price)) {
        return `$${price.toFixed(2).replace('.', ',')}`;
      }
      return fallbackLabel;
    };

    /* ==========================================================================
       6. COMPONENTE DE IMAGEN CON SOPORTE LOCAL Y RESPALDO AUTOMÁTICO
       ========================================================================== */
    function SmartImage({ localSrc, fallbackSrc, alt, className }) {
      const [imgSrc, setImgSrc] = useState(localSrc || fallbackSrc);
      const [triedFallback, setTriedFallback] = useState(false);

      useEffect(() => {
        setImgSrc(localSrc || fallbackSrc);
        setTriedFallback(false);
      }, [localSrc, fallbackSrc]);

      const handleError = () => {
        if (!triedFallback && fallbackSrc) {
          setImgSrc(fallbackSrc);
          setTriedFallback(true);
        }
      };

      return (
        <img
          src={imgSrc}
          alt={alt}
          onError={handleError}
          loading="lazy"
          className={className}
        />
      );
    }

        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();

      }, [onClose]);

        []
      );

      const permanentPizzas = useMemo(
        () => CATALOG_DATA.filter((p) => p.published && p.section === 'catalogo' && p.category === 'pizzas').sort((a, b) => a.order - b.order),
        []
      );

      const permanentPastichos = useMemo(
        () => CATALOG_DATA.filter((p) => p.published && p.section === 'catalogo' && p.category === 'pastichos').sort((a, b) => a.order - b.order),
        []

        if (!searchQuery.trim()) return true;
        const q = searchQuery.toLowerCase().trim();

        const inSubtitle = item.subtitle ? item.subtitle.toLowerCase().includes(q) : false;
        const inDesc = item.shortDescription ? item.shortDescription.toLowerCase().includes(q) : false;
        const inIngredients = item.ingredients ? item.ingredients.some(ing => ing.toLowerCase().includes(q)) : false;
        return inName || inSubtitle || inDesc || inIngredients;
      };

                      onClick={() => navigateTo('catalogo', 'all')}
                      className="mt-6 px-8 py-4 rounded-2xl bg-gradient-to-r from-qb-red to-qb-orange text-white font-extrabold text-sm uppercase tracking-wider"
                    >
                      Entrar al Catálogo ¡Qué Brutal! →
                    </button>
                  </div>
                )}

                {/* Cintillo de Pilares de Marca (Inspirado en la portada de Canva) */}
                <div className="mt-10 grid grid-cols-2 sm:grid-cols-4 gap-3 bg-qb-graphite/90 border border-qb-border rounded-2xl p-4 sm:p-5">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">🔥</span>
                    <div>
                      <span className="text-xs font-extrabold text-white uppercase block">Hecho con Alma</span>
                      <span className="text-[11px] text-gray-400">Fuego y pasión culinaria</span>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">🌾</span>
                    <div>
                      <span className="text-xs font-extrabold text-white uppercase block">Técnica Biga 24h</span>
                      <span className="text-[11px] text-gray-400">Masa viva de autor</span>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">🧀</span>
                    <div>
                      <span className="text-xs font-extrabold text-white uppercase block">Calidad Real</span>
                      <span className="text-[11px] text-gray-400">Ingredientes seleccionados</span>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">🛵</span>
                    <div>
                      <span className="text-xs font-extrabold text-white uppercase block">Atención Directa</span>
                      <span className="text-[11px] text-gray-400">Delivery y retiro en Maracay</span>
                    </div>
                  </div>
                </div>
              </section>
            </main>
          )}

          {/* ====================================================================
              VISTA 2: ESPECIAL NAVIDEÑO (SECCIÓN 6.4 DEL DOCUMENTO MAESTRO)
              ==================================================================== */}
          {activeView === 'navidad' && isChristmasSeason && (
            <main className="flex-1 christmas-glow">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
                {/* Barra de Retorno y Cambio Rápido de Experiencia */}
                <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
                  <button
                    onClick={() => navigateTo('portada')}
                    className="px-3.5 py-2 rounded-xl bg-qb-graphite hover:bg-qb-surface border border-qb-border text-xs font-bold text-gray-200 flex items-center gap-1.5"
                  >
                    <span>←</span>
                    <span>Volver a Portada</span>
                  </button>
                  <button
                    onClick={() => navigateTo('catalogo', 'all')}
                    className="px-4 py-2 rounded-xl bg-qb-surface hover:bg-qb-orange/20 border border-qb-orange/40 text-xs font-extrabold text-qb-amber flex items-center gap-1.5"
                  >
                    <span>🍕</span>
                    <span>Ir al Catálogo Permanente ¡Qué Brutal! →</span>
                  </button>
                </div>

                {/* Cabecera del Especial Navideño */}
                <div className="rounded-3xl bg-gradient-to-r from-qb-graphite via-[#1f1614] to-qb-graphite border border-qb-gold/40 p-6 sm:p-8 mb-8">
                  <span className="inline-block px-3 py-1 rounded-full bg-qb-red/30 border border-qb-gold/40 text-qb-gold text-xs font-extrabold uppercase tracking-wider">
                    🎄 {SEASONAL_CONFIG.subtitle}
                  </span>
                  <h1 className="font-display text-3xl sm:text-5xl font-black text-white mt-2">
                    {SEASONAL_CONFIG.title}
                  </h1>
                  <p className="text-sm sm:text-base text-gray-300 mt-2 max-w-2xl">
                    {SEASONAL_CONFIG.coverDescription} {SEASONAL_CONFIG.notice}
                  </p>
                </div>

                {/* Grilla de los 4 Productos Navideños (Sin subcategorías adicionales) */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {christmasProducts.map((product) => (
                    <ProductCard
                      key={product.id}
                      product={product}
                      onSelect={setActiveProduct}
                    />
                  ))}
                </div>
              </div>
            </main>
          )}

          {/* ====================================================================
              VISTA 3: CATÁLOGO PERMANENTE ¡QUÉ BRUTAL! (SECCIÓN 6.1, 6.2, 6.3)
              ==================================================================== */}
          {activeView === 'catalogo' && (
            <main className="flex-1 editorial-glow">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
                {/* Barra Superior de Navegación Interna y Cambio de Sección */}
                <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
                  <button
                    onClick={() => navigateTo('portada')}
                    className="px-3.5 py-2 rounded-xl bg-qb-graphite hover:bg-qb-surface border border-qb-border text-xs font-bold text-gray-200 flex items-center gap-1.5"
                  >
                    <span>←</span>
                    <span>Volver a Portada</span>
                  </button>

                  {isChristmasSeason && (
                    <button
                      onClick={() => navigateTo('navidad')}
                      className="px-4 py-2 rounded-xl bg-qb-red/20 hover:bg-qb-red/30 border border-qb-gold/40 text-xs font-extrabold text-qb-gold flex items-center gap-1.5"
                    >
                      <span>🎄</span>
                      <span>Ver Especial Navideño →</span>
                    </button>
                  )}
                </div>

                {/* Barra de Búsqueda Instantánea & Filtros Rápidos (Optimizada para Celulares y PC) */}
                <div className="sticky top-[60px] md:top-[68px] z-30 bg-qb-carbon/95 backdrop-blur-md py-3 border-y border-qb-border mb-6 space-y-3">
                  {/* Buscador en Vivo */}
                  <div className="relative max-w-xl mx-auto sm:mx-0">
                    <span className="absolute inset-y-0 left-3 flex items-center text-gray-400 text-sm pointer-events-none">
                      🔍
                    </span>
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Buscar pizza, pasticho, ingrediente (bacon, queso, maíz, mariscos)..."
                      className="w-full pl-9 pr-9 py-2.5 rounded-xl bg-qb-graphite border border-qb-border focus:border-qb-orange focus:outline-none text-xs sm:text-sm text-qb-warmWhite placeholder-gray-400"
                    />
                    {searchQuery && (
                      <button
                        type="button"
                        onClick={() => setSearchQuery('')}
                        className="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-white text-xs font-bold"
                        aria-label="Limpiar búsqueda"
                      >
                        ✕
                      </button>
                    )}
                  </div>

                  {/* Pills de Categorías con Conteo en Tiempo Real */}
                  <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pt-1">
                    {[
                      { id: 'all', label: 'Toda la Carta', icon: '🔥', count: totalDisplayedCount },
                      { id: 'pizzas', label: 'Pizzas & Minis', icon: '🍕', count: displayedPizzas.length },
                      { id: 'pastichos', label: 'Pastichos / Lasaña', icon: '🍝', count: displayedPastichos.length },
                      { id: 'paellas', label: 'Paellas Especiales', icon: '🥘', count: displayedPaellas.length }
                    ].map((cat) => (
                      <button
                        key={cat.id}
                        onClick={() => setSelectedCategory(cat.id)}
                        className={`shrink-0 px-3.5 py-1.5 rounded-full text-xs font-extrabold transition-all flex items-center gap-1.5 ${
                          selectedCategory === cat.id
                            ? 'bg-gradient-to-r from-qb-red to-qb-orange text-white shadow-md'
                            : 'bg-qb-graphite text-gray-300 border border-qb-border hover:border-qb-orange/50'
                        }`}
                      >
                        <span>{cat.icon}</span>
                        <span>{cat.label}</span>
                        <span className={`px-1.5 py-0.2 rounded-full text-[10px] ${selectedCategory === cat.id ? 'bg-black/40 text-white' : 'bg-qb-surface text-gray-400'}`}>
                          {cat.count}
                        </span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Aviso amigable si la búsqueda no arroja resultados */}
                {totalDisplayedCount === 0 && (
                  <div className="text-center py-16 bg-qb-graphite rounded-3xl border border-qb-border p-6 max-w-md mx-auto my-6">
                    <span className="text-4xl block mb-2">🔍</span>
                    <h3 className="font-display text-xl font-bold text-white">No encontramos coincidencias</h3>
                    <p className="text-xs text-gray-400 mt-1">No hay productos que coincidan con "{searchQuery}". Intenta con otro ingrediente.</p>
                    <button
                      onClick={() => setSearchQuery('')}
                      className="mt-4 px-4 py-2 rounded-xl bg-qb-orange text-white text-xs font-bold"
                    >
                      Ver todo el menú
                    </button>
                  </div>
                )}

                {/* 1. PIZZAS NAPOLITANAS ARTESANALES (PRODUCTO ESTRELLA PROTAGONISTA) */}
                {(selectedCategory === 'all' || selectedCategory === 'pizzas') && displayedPizzas.length > 0 && (
                  <section className="mb-14">
                    <div className="rounded-3xl bg-gradient-to-r from-qb-graphite via-qb-surface to-qb-graphite border border-qb-orange/40 p-6 sm:p-8 mb-6">
                      <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
                        <div>
                          <span className="inline-block px-3 py-1 rounded-full bg-qb-orange/20 border border-qb-orange/40 text-qb-amber text-xs font-extrabold uppercase tracking-wider">
                            🍕 Producto Estrella de la Casa · Masa Biga 24h
                          </span>
                          <h2 className="font-display text-3xl sm:text-4xl font-black text-white mt-2">
                            Pizzas Napolitanas Artesanales
                          </h2>
                          <p className="text-xs sm:text-sm text-gray-300 mt-1.5 max-w-2xl">
                            Elaboradas con prefermento Biga madurado durante 24 horas, borde alveolado, salsa de autor e ingredientes seleccionados en formato de 33 cm (8 porciones) y versión Mini Pizzas para eventos.
                          </p>
                        </div>
                        <div className="shrink-0 flex gap-2 text-xs font-mono font-bold text-qb-amber bg-qb-carbon px-4 py-2.5 rounded-xl border border-qb-border">
                          <span>📏 33 CM</span>
                          <span>•</span>
                          <span>8 Porciones</span>
                          <span>•</span>
                          <span>2 Personas</span>
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {displayedPizzas.map((pizza) => (
                        <ProductCard
                          key={pizza.id}
                          product={pizza}
                          onSelect={setActiveProduct}
                        />
                      ))}
                    </div>
                  </section>
                )}

                {/* 2. PASTICHOS */}
                {(selectedCategory === 'all' || selectedCategory === 'pastichos') && displayedPastichos.length > 0 && (
                  <section className="mb-14">
                    <div className="border-l-4 border-qb-orange pl-4 mb-6">
                      <span className="text-xs font-extrabold uppercase tracking-widest text-qb-orange">
                        Pastas al Horno & Gratinados
                      </span>
                      <h2 className="font-display text-2xl sm:text-3xl font-black text-white">
                        Pastichos & Lasañas Artesanales
                      </h2>
                      <p className="text-xs sm:text-sm text-gray-400 mt-1">
                        Capas generosas de pasta, ragú de cocción lenta, bechamel sedosa y queso fundido al horno.
                      </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {displayedPastichos.map((item) => (
                        <ProductCard
                          key={item.id}
                          product={item}
                          onSelect={setActiveProduct}
                        />
                      ))}
                    </div>
                  </section>
                )}

                {/* 3. PAELLAS Y ESPECIALIDADES DE CELEBRACIÓN */}
                {(selectedCategory === 'all' || selectedCategory === 'paellas') && displayedPaellas.length > 0 && (
                  <section className="mb-10">
                    <div className="border-l-4 border-qb-amber pl-4 mb-6">
                      <span className="text-xs font-extrabold uppercase tracking-widest text-qb-amber">
                        Especialidades por Encargo
                      </span>
                      <h2 className="font-display text-2xl sm:text-3xl font-black text-white">
                        Paellas y Platos de Celebración
                      </h2>
                      <p className="text-xs sm:text-sm text-gray-400 mt-1">
                        Preparaciones familiares hechas al momento bajo reserva previa para compartir en la mesa.
                      </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {displayedPaellas.map((item) => (
                        <ProductCard
                          key={item.id}
                          product={item}
                          onSelect={setActiveProduct}
                        />
                      ))}
                    </div>
                  </section>
                )}
              </div>
            </main>
          )}

          {/* ====================================================================
              VISTA 4: SECCIÓN INSTITUCIONAL ¿QUIÉNES SOMOS?
              ==================================================================== */}
          {activeView === 'quienes-somos' && (
            <main className="flex-1">
              <AboutSection
                onBackToCover={() => navigateTo('portada')}
                onExploreCatalog={() => navigateTo('catalogo', 'all')}
              />
            </main>
          )}

          {/* ====================================================================
              MODAL DE FICHA AMPLIADA DE PRODUCTO
              ==================================================================== */}
          <ProductDetailModal
            product={activeProduct}
            onClose={() => setActiveProduct(null)}
          />

          {/* ====================================================================
              PIE DE PÁGINA OFICIAL Y CANALES COMERCIALES CENTRALIZADOS
              ==================================================================== */}
          <footer className="bg-black border-t border-qb-border py-10 mt-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-8 items-start">
                <div>
                  <BrandLogo size="sm" onClick={() => navigateTo('portada')} />
                  <p className="text-xs text-gray-400 mt-3 leading-relaxed max-w-xs">
                    {BRAND_CONFIG.concept} Vitrina gastronómica digital de pizzas napolitanas artesanales, pastichos, paellas y especialidades de temporada.
                  </p>


                </div>

                <div>
                  <h4 className="text-xs font-extrabold uppercase tracking-wider text-qb-amber mb-3">
                    Navegación Rápida
                  </h4>
                  <ul className="space-y-2 text-xs text-gray-300">
                    <li>
                      <button onClick={() => navigateTo('portada')} className="hover:text-qb-amber">
                        • Portada Principal
                      </button>
                    </li>
                    {isChristmasSeason && (
                      <li>
                        <button onClick={() => navigateTo('navidad')} className="hover:text-qb-amber text-qb-gold font-semibold">
                          • Especial Navideño
                        </button>
                      </li>
                    )}
                    <li>
                      <button onClick={() => navigateTo('catalogo', 'pizzas')} className="hover:text-qb-amber">
                        • Pizzas Napolitanas Artesanales
                      </button>
                    </li>
                    <li>
                      <button onClick={() => navigateTo('catalogo', 'pastichos')} className="hover:text-qb-amber">
                        • Pastichos / Lasaña Italiana
                      </button>
                    </li>
                    <li>
                      <button onClick={() => navigateTo('catalogo', 'paellas')} className="hover:text-qb-amber">
                        • Paellas de Celebración
                      </button>
                    </li>
                    <li>
                      <button onClick={() => navigateTo('quienes-somos')} className="hover:text-qb-amber">
                        • ¿Quiénes Somos?
                      </button>
                    </li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-xs font-extrabold uppercase tracking-wider text-qb-amber mb-3">
                    Contacto Directo & Pedidos
                  </h4>
                  <div className="space-y-2 text-xs text-gray-300">
                    <p>📍 {BRAND_CONFIG.location}</p>
                    <p>
                      📞 Pedidos WhatsApp:{' '}
                      <a
                        href={`https://wa.me/${BRAND_CONFIG.contacts.primary.waNumber}`}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="text-white font-mono font-bold hover:text-qb-amber underline"
                      >
                        {BRAND_CONFIG.contacts.primary.display}
                      </a>
                    </p>
                    <p>
                      📞 Línea Profesional / Eventos:{' '}
                      <a
                        href={`https://wa.me/${BRAND_CONFIG.contacts.secondary.waNumber}`}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="text-white font-mono font-bold hover:text-qb-amber underline"
                      >
                        {BRAND_CONFIG.contacts.secondary.display}
                      </a>
                    </p>
                    <p>📸 Instagram: <strong className="text-white">{BRAND_CONFIG.instagram}</strong></p>
                  </div>
                </div>
              </div>

              <div className="mt-8 pt-6 border-t border-qb-border/60 flex flex-col sm:flex-row items-center justify-between text-[11px] text-gray-500 gap-2">
                <span>© {new Date().getFullYear()} {BRAND_CONFIG.name} — Todos los derechos reservados.</span>
                <span>Dirección Culinaria: Lic. Yorman Trabasilo · Maracay, Venezuela.</span>
              </div>
            </div>
          </footer>

          {/* ====================================================================
              BARRA INFERIOR DE ACCESO RÁPIDO PARA TELÉFONOS (BOTTOM APP BAR)
              Diseñada específicamente para navegación con el pulgar en móviles
              ==================================================================== */}
          <nav
            aria-label="Navegación móvil"
            className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-qb-carbon/95 backdrop-blur-xl border-t border-qb-border/90 pb-[max(0.5rem,env(safe-area-inset-bottom))] px-2 py-2 flex items-center justify-around shadow-[0_-8px_25px_rgba(0,0,0,0.7)]"
          >
            <button
              onClick={() => navigateTo('portada')}
              className={`flex-1 py-1 flex flex-col items-center gap-0.5 text-[10px] font-bold transition-colors ${
                activeView === 'portada' ? 'text-qb-orange' : 'text-gray-400 hover:text-white'
              }`}
            >
              <span className="text-lg">🏠</span>
              <span>Inicio</span>
            </button>

            {isChristmasSeason && (
              <button
                onClick={() => navigateTo('navidad')}
                className={`flex-1 py-1 flex flex-col items-center gap-0.5 text-[10px] font-bold transition-colors ${
                  activeView === 'navidad' ? 'text-qb-gold' : 'text-gray-400 hover:text-white'
                }`}
              >
                <span className="text-lg">🎄</span>
                <span>Navidad</span>
              </button>
            )}

            <button
              onClick={() => navigateTo('catalogo', 'all')}
              className={`flex-1 py-1 flex flex-col items-center gap-0.5 text-[10px] font-bold transition-colors ${
                activeView === 'catalogo' ? 'text-qb-orange' : 'text-gray-400 hover:text-white'
              }`}
            >
              <span className="text-lg">🍕</span>
              <span>Carta</span>
            </button>

            <button
              onClick={() => {
                navigateTo('catalogo', 'all');
                setTimeout(() => {
                  const input = document.querySelector('input[type="text"]');
                  if (input) input.focus();
                }, 200);
              }}
              className="flex-1 py-1 flex flex-col items-center gap-0.5 text-[10px] font-bold text-gray-400 hover:text-white"
            >
              <span className="text-lg">🔍</span>
              <span>Buscar</span>
            </button>

            <a
              href={`https://wa.me/${BRAND_CONFIG.contacts.primary.waNumber}?text=${encodeURIComponent('Hola ¡Qué Brutal! Me gustaría consultar el catálogo y hacer un pedido.')}`}
              target="_blank"
              rel="noopener noreferrer"
              className="flex-1 py-1 flex flex-col items-center gap-0.5 text-[10px] font-extrabold text-emerald-400 hover:text-emerald-300"
            >
              <span className="text-lg animate-pulse-subtle">💬</span>
              <span>Pedir</span>
            </a>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
